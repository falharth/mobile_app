name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          pip install --upgrade pip setuptools wheel
          pip install cython==3.0.11

      - name: Install kivy-ios toolchain
        run: |
          pip install kivy-ios

      - name: Build Python3 recipe
        run: |
          toolchain build python3

      - name: Build Kivy recipe
        run: |
          toolchain build kivy

      - name: Create Xcode project
        run: |
          toolchain create "Faisal Trading App" .

      - name: List Xcode project
        run: |
          ls -la faisaltradingapp-ios/ || ls -la *-ios/ || echo "No iOS project found"

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: faisaltradingapp-ios-xcode
          path: |
            *-ios/
          retention-days: 14
