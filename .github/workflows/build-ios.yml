name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          pip install --upgrade pip setuptools wheel
          pip install cython==3.0.11

      - name: Generate galaxy app icon
        run: |
          pip install Pillow
          python generate_icon.py

      - name: Install kivy-ios toolchain
        run: |
          pip install kivy-ios

      - name: Build Python3 recipe
        run: |
          toolchain build python3

      - name: Build Kivy recipe
        run: |
          toolchain build kivy

      - name: Create Xcode project
        run: |
          toolchain create "FaisalTradingApp" .

      - name: Set galaxy icon in Xcode project
        run: |
          PROJECT_DIR=$(find . -maxdepth 1 -name "*-ios" -type d | head -1)
          echo "Project dir: $PROJECT_DIR"
          # Copy icon into Xcode project
          cp icon.png "$PROJECT_DIR/icon.png"
          # Generate all required iOS icon sizes from 1024x1024 source
          ICON_DIR="$PROJECT_DIR/faisaltradingapp/Images.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          python3 -c "
from PIL import Image
import json

src = Image.open('icon.png').convert('RGBA')
sizes = [
    (20,1),(20,2),(20,3),(29,1),(29,2),(29,3),
    (40,2),(40,3),(60,2),(60,3),(76,1),(76,2),(83.5,2),(1024,1)
]
idioms = {
    (20,1):'ipad',(20,2):'iphone',(20,3):'iphone',
    (29,1):'ipad',(29,2):'iphone',(29,3):'iphone',
    (40,2):'iphone',(40,3):'iphone',
    (60,2):'iphone',(60,3):'iphone',
    (76,1):'ipad',(76,2):'ipad',(83.5,2):'ipad',(1024,1):'ios-marketing'
}
images = []
for (pts, scale) in sizes:
    px = int(pts * scale)
    name = f'icon_{px}x{px}.png'
    resized = src.resize((px, px), Image.LANCZOS)
    resized.save('$ICON_DIR/' + name)
    images.append({
        'filename': name,
        'idiom': idioms[(pts,scale)],
        'scale': f'{scale}x',
        'size': f'{pts}x{pts}'
    })

contents = {'images': images, 'info': {'author':'xcode','version':1}}
with open('$ICON_DIR/Contents.json', 'w') as f:
    json.dump(contents, f, indent=2)
print('Generated', len(images), 'icon sizes')
"

      - name: List Xcode project
        run: |
          ls -la *-ios/ || echo "No iOS project found"
          ls -la *-ios/faisaltradingapp/Images.xcassets/AppIcon.appiconset/ || echo "No icons found"

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: faisaltradingapp-ios-xcode
          path: |
            *-ios/
          retention-days: 14
